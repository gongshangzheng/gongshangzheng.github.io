name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 新 push 会取消还在跑的旧部署，避免排队叠加
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # 只在本次 push 实际改动了图片素材时才安装依赖并检查；其余 push 直接跳过
      - name: Check new figure margins (only when figures changed)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$GITHUB_EVENT_BEFORE" ]; then
            echo "非 push 或无基线提交，跳过图边距检查"
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_EVENT_BEFORE" 2>/dev/null || true
          CHANGED=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- media drafts/assets 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "无图片改动，跳过图边距检查"
            exit 0
          fi
          echo "图片有改动，运行图边距检查："
          echo "$CHANGED"
          python3 -m pip install --quiet Pillow numpy PyMuPDF
          python3 scripts/check-figure-whitespace.py --changed

      # 图片派生档（.w960/.w1600）与尺寸缓存按内容哈希复用：
      # 命中时只补新增图片，命中失败也能靠 restore-keys 拿到上一版做增量
      - name: Cache image derivatives
        uses: actions/cache@v4
        with:
          path: |
            .cache/image-dims.json
            .cache/image-variants.json
            public/media
          key: media-derivatives-${{ hashFiles('media/**/*.webp', 'media/**/*.png', 'media/**/*.jpg', 'media/**/*.svg') }}
          restore-keys: |
            media-derivatives-

      # 先构建再测试：性能门禁校验的是产物（体积预算、图片属性、按需注入），
      # 放在构建前等于没跑
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 直接以 artifact 部署 Pages：不再维护 gh-pages 分支，
      # 也不再触发单独的 pages-build-deployment 第二次构建
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
