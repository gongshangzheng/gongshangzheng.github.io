<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="{{base_url}}">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<!-- Prism.js 由 lib/generators/articles.js 按需注入（仅含代码块的页面） -->
<link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">
<link rel="stylesheet" href="assets/css/hugo-theme.css">
<style>
{{PAGE_STYLE}}
</style>
<script>
// Theme bootstrap: runs before first paint so light-theme readers never see a dark flash.
(function(){try{var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark');}}catch(e){}})();
</script>
</head>

<!-- INJECT content -->
</div>
<!-- INCLUDE footer -->
<!-- INJECT audio -->

<!-- Runtime bundle: merged at build time from assets/js/runtime/* + code-tabs + citation -->
<script defer src="assets/js/runtime.bundle.js"></script>
</body>
</html>
