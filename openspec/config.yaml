schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  本项目是静态博客站点，以内容生产为主：文章写入 src/pages/*.html，由 build.js 构建后发布。

  内容类 change（写文章 / 论文精读 / 调研报告 / 系列章节 / 书稿转写 / 课程笔记）必须使用
  库内模板：~/gongshangzheng.github.io/.agents/skills/blog-rules/templates/content-change/
  （proposal.md / design.md / tasks.md），不要沿用 OpenSpec 默认的通用软件工程槽位。

  门禁流程、豁免清单（draft/collect 模式、小修、用户显式跳过）与审批要求见：
  ~/gongshangzheng.github.io/.agents/skills/blog-rules/references/openspec-gate.md

  纯工程类 change（构建管线、脚本、模板、样式）不适用内容侧槽位，按通用工程写法即可。

  路径口径：库内 skill（SKILL.md 位于 ~/gongshangzheng.github.io/.agents/skills/）用
  ~/gongshangzheng.github.io/.agents/skills/<name>/... 引用；全局 skill（SKILL.md 位于
  ~/.agents/skills/）用 ~/.agents/skills/<name>/... 引用。

# Per-artifact rules (constraints for the artifact author; never copied into the artifact)
rules:
  proposal:
    - 内容类 change 的 proposal MUST 给出「文章清单」表：slug、标题（含系列编号）、类型、目标 alias、sub_id 分配、产出物路径
    - 内容类 change 的 Why MUST 说清触发来源与库内现状缺口，不得只写"想写这篇"
    - 涉及 sub_id 分配时 MUST 写明用 scripts/check-sub-id.py --suggest 得到的编号
  design:
    - 内容类 change 的 design.md MUST 包含「文章内容大纲」一节
    - 「文章内容大纲」MUST 逐篇给出：类型与目标位置（alias / sub_id / Hub）、服务对象（一句话）、章节骨架（每节："这一节写什么" + 素材来源文件 + 必备表/公式/图）、关键数据点（含数值与口径）、配图计划
    - 素材来源 MUST 指到具体文件（如 raw/<slug>/subagents/methodology.md §3.2），不得写"参考论文"
    - 形态特殊时可增删模板节次，但 MUST 保留「文章内容大纲」的等价信息并在 artifact 中说明偏离原因
  tasks:
    - 内容类 change 的任务组 MUST 覆盖：计划与素材 / 逐篇写作 / 三路 Review / 发布与构建 / Hub 与交叉回链 / 草稿状态回填
    - 写作组之前 MUST 有一条"用户已确认 design.md「文章内容大纲」"的审批前置任务
    - 每完成一项 MUST 立即把 `- [ ]` 改为 `- [x]`

# Per-operation guidance (advisory)
operations:
  apply:
    guidance:
      - 执行内容类 change 时，先确认"用户已确认大纲"这条审批前置任务已勾选；未获确认不得写 src/pages/ 或改 drafts/ 正文
      - 需求在实施中发生变化时，先走 openspec-update-change 回写 artifact，再继续执行
  archive:
    guidance:
      - 归档前核对 design.md 的「文章内容大纲」与最终发布的文章是否一致，偏离处逐条说明原因
