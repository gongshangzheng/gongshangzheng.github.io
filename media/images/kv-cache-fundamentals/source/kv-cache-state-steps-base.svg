<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1080" width="1320" height="1080" role="img" aria-labelledby="title desc"><title id="title">KV Cache：逐步读取与追加</title><desc id="desc">一层一个头的示意。Prefill计算ABC；decode处理D再处理E。分别画出K与Q匹配、softmax、V加权求和，以及经过其余网络之后选出下一token。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526278"/></marker></defs><rect width="100%" height="100%" fill="#fafbfd"/><g fill="#172b44" font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="44" font-size="28" fill="#172b44" font-weight="600" text-anchor="start">KV Cache 怎么运转：用当前 Q 查历史 K，再按权重汇总 V</text><text x="30" y="81" font-size="20" fill="#526278" font-weight="400" text-anchor="start">橙色：本轮新计算　蓝色：历史复用　紫色：当前 Q　每个格子是一条向量，不是一个数。</text><rect x="30" y="108" width="400" height="746" rx="10" fill="white" stroke="#cdd8e5"/><text x="50" y="147" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(1) Prefill</text><text x="50" y="183" font-size="22" fill="#172b44" font-weight="400" text-anchor="start">本轮输入：A、B、C</text><text x="50" y="216" font-size="19" fill="#526278" font-weight="400" text-anchor="start">下方展开一层、一个头</text><rect x="88" y="240" width="280" height="48" rx="10" fill="#eee8fa" stroke="none"/><text x="229.495" y="271" font-size="23" fill="#172b44" text-anchor="end">q</text><text x="230.495" y="276.52" font-size="16.099999999999998" fill="#172b44" text-anchor="start">C</text><text x="50" y="316" font-size="18" fill="#526278" font-weight="400" text-anchor="start">Prefill 算所有 Q；仅展开末位 C</text><text x="52" y="375" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">K</text><rect x="86" y="343" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="114.865" y="372" font-size="21" fill="#89501c" text-anchor="end">k</text><text x="115.865" y="377.04" font-size="14.7" fill="#89501c" text-anchor="start">A</text><rect x="148" y="343" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="176.865" y="372" font-size="21" fill="#89501c" text-anchor="end">k</text><text x="177.865" y="377.04" font-size="14.7" fill="#89501c" text-anchor="start">B</text><rect x="210" y="343" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="238.865" y="372" font-size="21" fill="#89501c" text-anchor="end">k</text><text x="239.865" y="377.04" font-size="14.7" fill="#89501c" text-anchor="start">C</text><text x="52" y="583" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">V</text><rect x="86" y="551" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="114.865" y="580" font-size="21" fill="#89501c" text-anchor="end">v</text><text x="115.865" y="585.04" font-size="14.7" fill="#89501c" text-anchor="start">A</text><rect x="148" y="551" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="176.865" y="580" font-size="21" fill="#89501c" text-anchor="end">v</text><text x="177.865" y="585.04" font-size="14.7" fill="#89501c" text-anchor="start">B</text><rect x="210" y="551" width="55" height="48" rx="5" fill="#fff0d9" stroke="none"/><text x="238.865" y="580" font-size="21" fill="#89501c" text-anchor="end">v</text><text x="239.865" y="585.04" font-size="14.7" fill="#89501c" text-anchor="start">C</text><rect x="88" y="424" width="280" height="82" rx="10" fill="#edf0f4" stroke="none"/><text x="228" y="454" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">Q 与每个 K 做点积</text><text x="228" y="485" font-size="19" fill="#172b44" font-weight="400" text-anchor="middle">缩放、softmax 得到权重</text><path d="M368 264 H401 V465 H374" fill="none" stroke="#526278" stroke-width="2" marker-end="url(#arrow)"/><path d="M204 393 V418" fill="none" stroke="#526278" stroke-width="2" marker-end="url(#arrow)"/><rect x="88" y="631" width="280" height="51" rx="10" fill="#e2f3ec" stroke="none"/><text x="228" y="664" font-size="20" fill="#172b44" font-weight="400" text-anchor="middle">按权重对各个 V 加权求和</text><path d="M368 467 H401 V656 H374" fill="none" stroke="#526278" stroke-width="2" marker-end="url(#arrow)"/><path d="M204 601 V625" fill="none" stroke="#526278" stroke-width="2" marker-end="url(#arrow)"/><text x="228" y="720" font-size="19" fill="#172b44" font-weight="400" text-anchor="middle">得到当前头的 attention 输出</text><path d="M228 685 V696" fill="none" stroke="#526278" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="766" font-size="18" fill="#526278" font-weight="400" text-anchor="start">经本层其余运算、后续层与输出层</text><text x="50" y="798" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">选出 D；缓存含 ABC</text><text x="50" y="832" font-size="20" fill="#89501c" font-weight="400" text-anchor="start">此时尚无 D 的 K/V</text><rect x="460" y="108" width="400" height="746" rx="10" fill="white" stroke="#cdd8e5"/><text x="480" y="147" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(2) Decode 1</text><text x="480" y="183" font-size="22" fill="#172b44" font-weight="400" text-anchor="start">本轮输入：D</text><text x="480" y="216" font-size="19" fill="#526278" font-weight="400" text-anchor="start">下方展开一层、一个头</text><rect x="518" y="240" width="280" height="48" rx="10" fill="#eee8fa" stroke="none"/><text x="659.495" y="271" font-size="23" fill="#172b44" text-anchor="end">q</text><text x="660.495" y="276.52" font-size="16.099999999999998" fill="#172b44" text-anchor="start">D</text><text x="480" y="316" font-size="19" fill="#526278" font-weight="400" text-anchor="start">仅新位置产生 Q / K / V</text><text x="482" y="375" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">K</text><rect x="516" y="343" width="55" height="48" rx="5" fill="#e5effa" stroke="none"/><text x="544.865" y="372" font-size="21" fill="#24588e" text-anchor="end">k</text><text x="545.865" y="377.04" font-size="14.7" fill="#24588e" text-anchor="start">A</text><rect x="578" y="343" width="55" height="48" rx="5" fill="#e5effa" stroke="none"/><text x="606.865" y="372" 