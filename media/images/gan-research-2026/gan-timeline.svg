<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="GAN research timeline"><rect width="1100" height="420" rx="24" fill="#f8fafc"/><line x1="90" y1="210" x2="1010" y2="210" stroke="#334155" stroke-width="4"/><g font-family="Arial, sans-serif"><circle cx="120" cy="210" r="12" fill="#7c3aed"/><text x="120" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#312e81">2014</text><text x="120" y="245" text-anchor="middle" font-size="15" fill="#475569">GAN / cGAN</text><circle cx="280" cy="210" r="12" fill="#0284c7"/><text x="280" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#075985">2015</text><text x="280" y="245" text-anchor="middle" font-size="15" fill="#475569">DCGAN</text><circle cx="430" cy="210" r="12" fill="#16a34a"/><text x="430" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">2016</text><text x="430" y="245" text-anchor="middle" font-size="15" fill="#475569">SRGAN / pix2pix</text><circle cx="590" cy="210" r="12" fill="#f97316"/><text x="590" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">2017</text><text x="590" y="245" text-anchor="middle" font-size="15" fill="#475569">WGAN / CycleGAN</text><text x="590" y="270" text-anchor="middle" font-size="15" fill="#475569">WGAN-GP / PGGAN</text><circle cx="780" cy="210" r="12" fill="#dc2626"/><text x="780" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">2018</text><text x="780" y="245" text-anchor="middle" font-size="15" fill="#475569">SN-GAN / SAGAN</text><text x="780" y="270" text-anchor="middle" font-size="15" fill="#475569">BigGAN / StyleGAN</text><circle cx="950" cy="210" r="12" fill="#0f766e"/><text x="950" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#115e59">2019+</text><text x="950" y="245" text-anchor="middle" font-size="15" fill="#475569">StyleGAN2</text><text x="950" y="270" text-anchor="middle" font-size="15" fill="#475569">regularization surveys</text><text x="550" y="64" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">GAN 从博弈框架走向工程化图像生成的关键转折</text><text x="550" y="350" text-anchor="middle" font-size="16" fill="#475569">时间线不是论文列表，而是三次迁移：从目标函数到架构约束，从无条件到条件应用，从训练稳定到大规模高保真。</text></g></svg>