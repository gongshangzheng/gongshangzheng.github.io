<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="GAN minimax game"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="920" height="360" rx="24" fill="#f8fafc"/><rect x="60" y="78" width="190" height="84" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="155" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#312e81">Generator G</text><text x="155" y="140" text-anchor="middle" font-size="15" fill="#475569">noise z → fake sample</text><rect x="60" y="218" width="190" height="70" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="155" y="260" text-anchor="middle" font-size="21" font-weight="700" fill="#075985">Real data</text><rect x="405" y="132" width="210" height="96" rx="20" fill="url(#g1)"/><text x="510" y="170" text-anchor="middle" font-size="24" font-weight="800" fill="white">Discriminator D</text><text x="510" y="200" text-anchor="middle" font-size="15" fill="white">real / fake probability</text><rect x="710" y="132" width="150" height="96" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="785" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#9a3412">Loss</text><text x="785" y="200" text-anchor="middle" font-size="15" fill="#9a3412">min G · max D</text><path d="M250 120 C305 120 335 146 405 166" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 253 C314 253 340 211 405 197" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 180 L710 180" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 132 C690 52 420 42 220 78" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="490" y="48" text-anchor="middle" font-size="17" fill="#991b1b">gradient signal trains G to fool D</text><text x="460" y="326" text-anchor="middle" font-size="16" fill="#475569">原始 GAN 的核心：两个网络通过同一个判别信号形成动态博弈。</text></svg>