<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-label="GAN stability toolkit"><rect width="1040" height="520" rx="24" fill="#f8fafc"/><text x="520" y="58" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">稳定 GAN 训练的四类工具箱</text><g font-family="Arial, sans-serif"><rect x="70" y="110" width="205" height="270" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="172" y="150" text-anchor="middle" font-size="21" font-weight="800" fill="#312e81">目标函数</text><text x="172" y="195" text-anchor="middle" font-size="16" fill="#475569">Wasserstein distance</text><text x="172" y="225" text-anchor="middle" font-size="16" fill="#475569">least-squares / hinge</text><text x="172" y="255" text-anchor="middle" font-size="16" fill="#475569">non-saturating loss</text><text x="172" y="310" text-anchor="middle" font-size="14" fill="#6b7280">让梯度信号更可用</text><rect x="310" y="110" width="205" height="270" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="412" y="150" text-anchor="middle" font-size="21" font-weight="800" fill="#075985">Lipschitz 约束</text><text x="412" y="195" text-anchor="middle" font-size="16" fill="#475569">weight clipping</text><text x="412" y="225" text-anchor="middle" font-size="16" fill="#475569">gradient penalty</text><text x="412" y="255" text-anchor="middle" font-size="16" fill="#475569">spectral normalization</text><text x="412" y="310" text-anchor="middle" font-size="14" fill="#6b7280">限制判别器过强</text><rect x="550" y="110" width="205" height="270" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="652" y="150" text-anchor="middle" font-size="21" font-weight="800" fill="#166534">架构归纳偏置</text><text x="652" y="195" text-anchor="middle" font-size="16" fill="#475569">DCGAN constraints</text><text x="652" y="225" text-anchor="middle" font-size="16" fill="#475569">progressive growing</text><text x="652" y="255" text-anchor="middle" font-size="16" fill="#475569">self-attention</text><text x="652" y="310" text-anchor="middle" font-size="14" fill="#6b7280">降低搜索空间难度</text><rect x="790" y="110" width="205" height="270" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="892" y="150" text-anchor="middle" font-size="21" font-weight="800" fill="#9a3412">采样与尺度</text><text x="892" y="195" text-anchor="middle" font-size="16" fill="#475569">orthogonal regularization</text><text x="892" y="225" text-anchor="middle" font-size="16" fill="#475569">truncation trick</text><text x="892" y="255" text-anchor="middle" font-size="16" fill="#475569">large batch / scaling</text><text x="892" y="310" text-anchor="middle" font-size="14" fill="#6b7280">控制保真度-多样性取舍</text><text x="520" y="448" text-anchor="middle" font-size="17" fill="#475569">这些技巧不是互相替代：真实系统往往组合目标函数、归一化、架构和采样策略。</text></g></svg>