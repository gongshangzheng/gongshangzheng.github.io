<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">人工智能的发展、热潮与降温</title><desc id="desc">从1940年代到现代模型的九个历史定位；研究方向彼此重叠，不按年份等比例绘制。</desc><rect width="1200" height="760" rx="16" fill="#faf9f6"/><g font-family="sans-serif" fill="#243849"><text x="36" y="44" font-size="25">人工智能：研究路线与热潮并不完全同步</text><text x="36" y="75" font-size="16">按行阅读；年代为大致定位，各地区与领域有差异。寒冬不意味着所有研究停止。</text><rect x="36" y="108" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="50" y="137" font-size="15" fill="#507483">1940—1950年代</text><text x="50" y="183" font-size="19">基础思想与早期模型</text><text x="50" y="227" font-size="15">人工神经元、学习机器、图灵</text><rect x="422" y="108" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="436" y="137" font-size="15" fill="#507483">1955—1956</text><text x="436" y="183" font-size="19">达特茅斯计划与研究活动</text><text x="436" y="227" font-size="15">多个研究方向汇聚</text><rect x="808" y="108" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="822" y="137" font-size="15" fill="#507483">1950—1960年代</text><text x="822" y="183" font-size="19">早期成果与第一轮热潮</text><text x="822" y="227" font-size="15">推理、搜索与学习模型</text><rect x="36" y="305" width="360" height="166" rx="10" fill="#f1e7e3" stroke="#c7d4d9"/><text x="50" y="334" font-size="15" fill="#507483">1960年代后期—1970年代</text><text x="50" y="380" font-size="19">现实困难与第一轮降温</text><text x="50" y="424" font-size="15">规模、不确定性与资助变化</text><rect x="422" y="305" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="436" y="334" font-size="15" fill="#507483">1970—1980年代</text><text x="436" y="380" font-size="19">知识工程与专家系统热潮</text><text x="436" y="424" font-size="15">DENDRAL、MYCIN、R1/XCON</text><rect x="808" y="305" width="360" height="166" rx="10" fill="#f1e7e3" stroke="#c7d4d9"/><text x="822" y="334" font-size="15" fill="#507483">1980年代末以后</text><text x="822" y="380" font-size="19">商业降温与第二次寒冬</text><text x="822" y="424" font-size="15">部署、维护成本和预期落差</text><rect x="36" y="502" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="50" y="531" font-size="15" fill="#507483">1980—2000年代持续发展</text><text x="50" y="577" font-size="19">概率、统计学习与神经网络</text><text x="50" y="621" font-size="15">研究在降温期仍继续</text><rect x="422" y="502" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="436" y="531" font-size="15" fill="#507483">2010年代</text><text x="436" y="577" font-size="19">深度学习推动新一轮热潮</text><text x="436" y="621" font-size="15">数据、计算与学习表示</text><rect x="808" y="502" width="360" height="166" rx="10" fill="#ffffff" stroke="#c7d4d9"/><text x="822" y="531" font-size="15" fill="#507483">2017年以后</text><text x="822" y="577" font-size="19">Transformer、预训练与生成</text><text x="822" y="621" font-size="15">现代模型的规模与应用扩展</text><text x="36" y="724" font-size="14">依据：达特茅斯提案；Russell与Norvig《人工智能：一种现代方法》第1章。现代节点见系列后续文章。</text></g></svg>