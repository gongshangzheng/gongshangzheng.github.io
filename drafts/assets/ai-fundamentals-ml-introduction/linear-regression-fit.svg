<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">线性回归用直线拟合学习时长与测验分数</title>
<desc id="desc">三个观测点，拟合直线，以及观测值与预测值之间的残差虚线。</desc>
<rect width="760" height="430" rx="12" fill="#faf9f6"/>
<g font-family="sans-serif" fill="#243849">
<text x="48" y="42" font-size="22">用一条直线概括数据中的趋势</text>
<text x="48" y="69" font-size="15" fill="#526b78">示例数据：学习时长与测验分数</text>
<g stroke="#dce3e4" stroke-width="1" fill="none">
<path d="M100 330H690M100 270H690M100 210H690M100 150H690M100 90H690"/>
<path d="M100 90V330M247 90V330M395 90V330M542 90V330M690 90V330"/>
</g>
<g stroke="#526b78" stroke-width="2" fill="none"><path d="M100 90V330H690"/></g>
<g font-size="13" fill="#526b78"><text x="67" y="334">40</text><text x="67" y="274">50</text><text x="67" y="214">60</text><text x="67" y="154">70</text><text x="67" y="94">80</text><text x="96" y="352">0</text><text x="243" y="352">1</text><text x="391" y="352">2</text><text x="538" y="352">3</text><text x="686" y="352">4</text><text x="330" y="384" font-size="15">学习时长（小时）</text><text x="20" y="210" transform="rotate(-90 20 210)" font-size="15">测验分数</text></g>
<path d="M100 330L662 90" stroke="#178577" stroke-width="4" fill="none"/>
<g stroke="#bd7855" stroke-width="2" stroke-dasharray="5 5" fill="none"><path d="M247 258L247 267"/><path d="M395 204L395 222"/><path d="M542 132L542 141"/></g>
<g fill="#d76b4c" stroke="white" stroke-width="3"><circle cx="247" cy="258" r="8"/><circle cx="395" cy="222" r="8"/><circle cx="542" cy="132" r="8"/></g>
<g font-size="14"><circle cx="490" cy="397" r="6" fill="#d76b4c"/><text x="504" y="402">观测分数</text><path d="M600 397h24" stroke="#178577" stroke-width="4"/><text x="632" y="402">拟合直线</text></g>
<text x="473" y="116" font-size="14" fill="#178577">预测值 = 40 + 10.5 × 时长</text>
</g></svg>
