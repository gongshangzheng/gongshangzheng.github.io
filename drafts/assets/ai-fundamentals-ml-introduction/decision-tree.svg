<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="title desc">
<title id="title">决策树筛选谷粒的教学示意</title><desc id="desc">先判断质量是否偏低，质量不低则预测饱满谷粒；偏低时再判断外形是否饱满，最后预测类别。</desc>
<rect width="840" height="350" fill="#faf8f3"/>
<g fill="none" stroke="#6d746b" stroke-width="2"><path d="M420 77L235 151M420 77L625 151M235 201L120 274M235 201L350 274"/></g>
<g fill="#2f3835" font-family="sans-serif" font-size="18" text-anchor="middle">
<rect x="310" y="25" width="220" height="52" rx="9" fill="#e7eddc" stroke="#8d9b7e"/>
<text x="420" y="57">质量是否偏低？</text>
<rect x="125" y="151" width="220" height="50" rx="9" fill="#e7eddc" stroke="#8d9b7e"/>
<text x="235" y="182">外形是否饱满？</text>
<rect x="535" y="151" width="180" height="50" rx="9" fill="#eee2c8"/>
<text x="625" y="182">预测：饱满谷粒</text>
<rect x="35" y="274" width="170" height="50" rx="9" fill="#eee2c8"/>
<text x="120" y="305">预测：空壳</text>
<rect x="260" y="274" width="180" height="50" rx="9" fill="#eee2c8"/>
<text x="350" y="305">预测：饱满谷粒</text>
<text x="305" y="110">是</text><text x="540" y="110">否</text>
<text x="155" y="237">否</text><text x="310" y="237">是</text>
<text x="670" y="300" font-size="15" fill="#70756c">规则仅为教学示意</text>
</g></svg>
