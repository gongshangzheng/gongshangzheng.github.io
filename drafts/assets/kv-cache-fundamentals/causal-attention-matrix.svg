<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" role="img" aria-labelledby="title desc"><title id="title">因果注意力：追加新token，旧位置的依赖不变</title><desc id="desc">行表示Q位置，列表示K/V位置。左ABC矩阵和右ABCD矩阵用相同格距。旧三乘三依赖不变，新D行可读ABC和D，旧行不能读D。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526278"/></marker></defs><rect width="100%" height="100%" fill="#fafbfd"/><g fill="#172b44" font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="29" fill="#172b44" font-weight="600" text-anchor="start">Causal attention：新位置可以读历史，历史不能读新位置</text><text x="32" y="82" font-size="20" fill="#526278" font-weight="400" text-anchor="start">行 = 发起查询的 Q 位置；列 = 可读取的 K / V 位置。颜色表示可见性，不是权重大小。</text><rect x="32" y="108" width="564" height="450" rx="10" fill="white" stroke="#cdd8e5"/><text x="56" y="148" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(1) 输入 A、B、C</text><text x="156" y="189" font-size="19" fill="#526278" font-weight="400" text-anchor="start">K / V 位置</text><text x="56" y="255" font-size="21" fill="#172b44" font-weight="600" text-anchor="start">Q</text><text x="185" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">A</text><text x="251" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">B</text><text x="317" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">C</text><text x="132" y="256" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">A</text><rect x="156" y="218" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="185" y="255" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="222" y="218" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M245 241 L257 253 M245 253 L257 241" fill="none" stroke="#7b8998" stroke-width="2"/><rect x="288" y="218" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M311 241 L323 253 M311 253 L323 241" fill="none" stroke="#7b8998" stroke-width="2"/><text x="132" y="322" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">B</text><rect x="156" y="284" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="185" y="321" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="222" y="284" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="251" y="321" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="288" y="284" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M311 307 L323 319 M311 319 L323 307" fill="none" stroke="#7b8998" stroke-width="2"/><text x="132" y="388" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">C</text><rect x="156" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="185" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="222" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="251" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="288" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="317" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="151" y="213" width="200" height="200" rx="7" fill="none" stroke="#24588e" stroke-width="2" stroke-dasharray="6 4"/><text x="56" y="530" font-size="20" fill="#24588e" font-weight="400" text-anchor="start">虚线框：相同的 A、B、C 依赖区域</text><rect x="644" y="108" width="564" height="450" rx="10" fill="white" stroke="#cdd8e5"/><text x="668" y="148" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(2) 追加 D</text><text x="768" y="189" font-size="19" fill="#526278" font-weight="400" text-anchor="start">K / V 位置</text><text x="668" y="255" font-size="21" fill="#172b44" font-weight="600" text-anchor="start">Q</text><text x="797" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">A</text><text x="863" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">B</text><text x="929" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">C</text><text x="995" y="210" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">D</text><text x="744" y="256" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">A</text><rect x="768" y="218" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="797" y="255" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="834" y="218" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M857 241 L869 253 M857 253 L869 241" fill="none" stroke="#7b8998" stroke-width="2"/><rect x="900" y="218" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M923 241 L935 253 M923 253 L935 241" fill="none" stroke="#7b8998" stroke-width="2"/><rect x="966" y="218" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M989 241 L1001 253 M989 253 L1001 241" fill="none" stroke="#7b8998" stroke-width="2"/><text x="744" y="322" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">B</text><rect x="768" y="284" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="797" y="321" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="834" y="284" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="863" y="321" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="900" y="284" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M923 307 L935 319 M923 319 L935 307" fill="none" stroke="#7b8998" stroke-width="2"/><rect x="966" y="284" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M989 307 L1001 319 M989 319 L1001 307" fill="none" stroke="#7b8998" stroke-width="2"/><text x="744" y="388" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">C</text><rect x="768" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="797" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="834" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="863" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="900" y="350" width="58" height="58" rx="5" fill="#e5effa" stroke="none"/><text x="929" y="387" font-size="19" fill="#24588e" font-weight="400" text-anchor="middle">可见</text><rect x="966" y="350" width="58" height="58" rx="5" fill="#edf0f4" stroke="none"/><path d="M989 373 L1001 385 M989 385 L1001 373" fill="none" stroke="#7b8998" stroke-width="2"/><text x="744" y="454" font-size="21" fill="#172b44" font-weight="400" text-anchor="middle">D</text><rect x="768" y="416" width="58" height="58" rx="5" fill="#fff0d9" stroke="none"/><text x="797" y="453" font-size="19" fill="#89501c" font-weight="400" text-anchor="middle">可见</text><rect x="834" y="416" width="58" height="58" rx="5" fill="#fff0d9" stroke="none"/><text x="863" y="453" font-size="19" fill="#89501c" font-weight="400" text-anchor="middle">可见</text><rect x="900" y="416" width="58" height="58" rx="5" fill="#fff0d9" stroke="none"/><text x="929" y="453" font-size="19" fill="#89501c" font-weight="400" text-anchor="middle">可见</text><rect x="966" y="416" width="58" height="58" rx="5" fill="#fff0d9" stroke="none"/><text x="995" y="453" font-size="19" fill="#89501c" font-weight="400" text-anchor="middle">可见</text><rect x="763" y="213" width="200" height="200" rx="7" fill="none" stroke="#24588e" stroke-width="2" stroke-dasharray="6 4"/><text x="668" y="530" font-size="20" fill="#24588e" font-weight="400" text-anchor="start">虚线框：相同的 A、B、C 依赖区域</text><text x="32" y="605" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">读图关键：右图左上角不变；D 行新增可见位置，旧行的 D 列仍被屏蔽。</text><text x="32" y="648" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">因此在固定参数、相同前缀与一致的位置处理下，各层旧隐藏状态及 K/V 可以复用。</text><text x="32" y="699" font-size="19" fill="#526278" font-weight="400" text-anchor="start">标准 decoder-only 因果模型的自绘教学示意；不表示实测 attention 权重。</text></g></svg>