<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-labelledby="title desc"><title id="title">不使用与使用KV Cache的状态计算对照</title><desc id="desc">生成相同的D、E、F。无缓存依次重算ABC、ABCD、ABCDE；有缓存先算ABC，再新增D和E。历史attention读取仍保留。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526278"/></marker></defs><rect width="100%" height="100%" fill="#fafbfd"/><g fill="#172b44" font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="46" font-size="29" fill="#172b44" font-weight="600" text-anchor="start">同样预测 D、E、F：哪些状态需要重新计算？</text><text x="32" y="82" font-size="20" fill="#526278" font-weight="400" text-anchor="start">每个位置格代表该位置各层的状态计算；内部写 K/V 以突出未来需要保留的部分。</text><rect x="32" y="111" width="592" height="433" rx="10" fill="white" stroke="#cdd8e5"/><text x="54" y="151" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(1) 不使用 KV Cache</text><text x="54" y="223" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 D</text><rect x="149" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="201.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="202.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">A</text><text x="189" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="239" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="291.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="292.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">B</text><text x="279" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="329" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="381.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="382.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">C</text><text x="369" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><text x="54" y="331" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 E</text><rect x="149" y="299" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="201.3" y="328" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="202.3" y="332.8" font-size="14.0" fill="#89501c" text-anchor="start">A</text><text x="189" y="358" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="239" y="299" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="291.3" y="328" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="292.3" y="332.8" font-size="14.0" fill="#89501c" text-anchor="start">B</text><text x="279" y="358" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="329" y="299" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="381.3" y="328" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="382.3" y="332.8" font-size="14.0" fill="#89501c" text-anchor="start">C</text><text x="369" y="358" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="419" y="299" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="471.3" y="328" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="472.3" y="332.8" font-size="14.0" fill="#89501c" text-anchor="start">D</text><text x="459" y="358" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><text x="54" y="439" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 F</text><rect x="149" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="201.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="202.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">A</text><text x="189" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="239" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="291.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="292.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">B</text><text x="279" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="329" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="381.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="382.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">C</text><text x="369" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="419" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="471.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="472.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">D</text><text x="459" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="509" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="561.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="562.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">E</text><text x="549" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="656" y="111" width="592" height="433" rx="10" fill="white" stroke="#cdd8e5"/><text x="678" y="151" font-size="25" fill="#172b44" font-weight="600" text-anchor="start">(2) 使用 KV Cache</text><text x="678" y="223" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 D</text><rect x="773" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="825.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="826.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">A</text><text x="813" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="863" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="915.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="916.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">B</text><text x="903" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><rect x="953" y="191" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="1005.3" y="220" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="1006.3" y="224.8" font-size="14.0" fill="#89501c" text-anchor="start">C</text><text x="993" y="250" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><text x="678" y="331" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 E</text><rect x="773" y="299" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="825.3" y="328" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="826.3" y="332.8" font-size="14.0" fill="#24588e" text-anchor="start">A</text><text x="813" y="358" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="863" y="299" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="915.3" y="328" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="916.3" y="332.8" font-size="14.0" fill="#24588e" text-anchor="start">B</text><text x="903" y="358" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="953" y="299" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="1005.3" y="328" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="1006.3" y="332.8" font-size="14.0" fill="#24588e" text-anchor="start">C</text><text x="993" y="358" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="1043" y="299" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="1095.3" y="328" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="1096.3" y="332.8" font-size="14.0" fill="#89501c" text-anchor="start">D</text><text x="1083" y="358" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><text x="678" y="439" font-size="21" fill="#172b44" font-weight="400" text-anchor="start">预测 F</text><rect x="773" y="407" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="825.3" y="436" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="826.3" y="440.8" font-size="14.0" fill="#24588e" text-anchor="start">A</text><text x="813" y="466" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="863" y="407" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="915.3" y="436" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="916.3" y="440.8" font-size="14.0" fill="#24588e" text-anchor="start">B</text><text x="903" y="466" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="953" y="407" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="1005.3" y="436" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="1006.3" y="440.8" font-size="14.0" fill="#24588e" text-anchor="start">C</text><text x="993" y="466" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="1043" y="407" width="80" height="75" rx="6" fill="#e5effa" stroke="none"/><text x="1095.3" y="436" font-size="20" fill="#24588e" text-anchor="end">K/V</text><text x="1096.3" y="440.8" font-size="14.0" fill="#24588e" text-anchor="start">D</text><text x="1083" y="466" font-size="18" fill="#24588e" font-weight="400" text-anchor="middle">复用</text><rect x="1133" y="407" width="80" height="75" rx="6" fill="#fff0d9" stroke="none"/><text x="1185.3" y="436" font-size="20" fill="#89501c" text-anchor="end">K/V</text><text x="1186.3" y="440.8" font-size="14.0" fill="#89501c" text-anchor="start">E</text><text x="1173" y="466" font-size="18" fill="#89501c" font-weight="400" text-anchor="middle">新算</text><text x="32" y="591" font-size="22" fill="#172b44" font-weight="600" text-anchor="start">橙色：本轮产生状态；蓝色：直接复用历史。旧位置不再经过整套网络重算。</text><text x="32" y="635" font-size="22" fill="#172b44" font-weight="400" text-anchor="start">但当前 Q 仍要读取可见 K/V，并完成 attention；缓存没有让历史变得免费。</text><text x="32" y="681" font-size="20" fill="#526278" font-weight="400" text-anchor="start">3 + 4 + 5 与 3 + 1 + 1 只比较位置处理次数，不能解释为 FLOPs 比或加速倍数。</text><text x="32" y="718" font-size="18" fill="#526278" font-weight="400" text-anchor="start">标准逐 token 因果生成的自绘教学示意；不涵盖推测解码等扩展。</text></g></svg>