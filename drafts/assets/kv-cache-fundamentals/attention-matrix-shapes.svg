<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1090" viewBox="0 0 1360 1090">
<title>Self-attention 的矩阵计算与 KV 缓存</title><desc>Prefill阶段用逐格矩阵表示单层单头因果自注意力；decode阶段展示新位置 E 对缓存 K/V 的读取，以及缓存不包含 Q 和注意力矩阵。</desc>
<rect width="1360" height="1090" fill="#fbfcfe"/>
<g font-family="Hiragino Sans GB, Arial, sans-serif" fill="#202b3c">
<text x="64" y="68" font-size="36" font-weight="700">自注意力：矩阵计算与 KV 缓存</text>
<text x="64" y="108" font-size="19" fill="#526174">单层、单头示意；方格表示张量元素，箭头表示矩阵运算</text>
<rect x="64" y="138" width="1232" height="456" rx="18" fill="#fff" stroke="#d8e0eb" stroke-width="2"/>
<text x="92" y="180" font-size="25" font-weight="700">Prefill · 一次处理 n=4 个位置</text>
<text x="92" y="211" font-size="17" fill="#526174">dh=dv=3；注意力分数先缩放，再施加因果遮罩，最后按行 softmax</text>
</g>
<g font-family="Hiragino Sans GB, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
<!-- Q grid 4x3 -->
<text x="150" y="258" fill="#7541a6">Q (4×3)</text>
<g fill="#eadcf7" stroke="#7541a6" stroke-width="1.5">
<rect x="95" y="274" width="28" height="28"/><rect x="123" y="274" width="28" height="28"/><rect x="151" y="274" width="28" height="28"/>
<rect x="95" y="302" width="28" height="28"/><rect x="123" y="302" width="28" height="28"/><rect x="151" y="302" width="28" height="28"/>
<rect x="95" y="330" width="28" height="28"/><rect x="123" y="330" width="28" height="28"/><rect x="151" y="330" width="28" height="28"/>
<rect x="95" y="358" width="28" height="28"/><rect x="123" y="358" width="28" height="28"/><rect x="151" y="358" width="28" height="28"/></g>
<text x="205" y="336" font-size="26" fill="#344054">×</text>
<!-- KT grid 3x4 -->
<text x="292" text-anchor="start" y="258" fill="#27649b">K</text><text x="306" text-anchor="start" y="246" font-size="13" fill="#27649b">T</text><text x="318" text-anchor="start" y="258" fill="#27649b">(3×4)</text>
<g fill="#d8ebfa" stroke="#27649b" stroke-width="1.5">
<rect x="251" y="274" width="28" height="28"/><rect x="279" y="274" width="28" height="28"/><rect x="307" y="274" width="28" height="28"/><rect x="335" y="274" width="28" height="28"/>
<rect x="251" y="302" width="28" height="28"/><rect x="279" y="302" width="28" height="28"/><rect x="307" y="302" width="28" height="28"/><rect x="335" y="302" width="28" height="28"/>
<rect x="251" y="330" width="28" height="28"/><rect x="279" y="330" width="28" height="28"/><rect x="307" y="330" width="28" height="28"/><rect x="335" y="330" width="28" height="28"/></g>
<path d="M375 330H421" stroke="#65758b" stroke-width="2.5"/><path d="M421 330l-10-6v12z" fill="#65758b"/>
<text x="455" y="258" fill="#344054">scores (4×4)</text>
<!-- scores 4x4 -->
<g fill="#edf1f6" stroke="#77869a" stroke-width="1.3">
<rect x="424" y="274" width="28" height="28"/><rect x="452" y="274" width="28" height="28"/><rect x="480" y="274" width="28" height="28"/><rect x="508" y="274" width="28" height="28"/>
<rect x="424" y="302" width="28" height="28"/><rect x="452" y="302" width="28" height="28"/><rect x="480" y="302" width="28" height="28"/><rect x="508" y="302" width="28" height="28"/>
<rect x="424" y="330" width="28" height="28"/><rect x="452" y="330" width="28" height="28"/><rect x="480" y="330" width="28" height="28"/><rect x="508" y="330" width="28" height="28"/>
<rect x="424" y="358" width="28" height="28"/><rect x="452" y="358" width="28" height="28"/><rect x="480" y="358" width="28" height="28"/><rect x="508" y="358" width="28" height="28"/></g>
<text x="566" y="336" font-size="25" fill="#344054">→</text>
<text x="660" y="258" fill="#344054">M + row-softmax</text>
<!-- weights triangular 4x4; masked upper right gray crosses drawn geometry -->
<g stroke-width="1.3">
<!-- row1 -->
<rect x="612" y="274" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="644" y="274" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/><rect x="676" y="274" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/><rect x="708" y="274" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/>
<!-- row2 -->
<rect x="612" y="302" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="644" y="302" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="676" y="302" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/><rect x="708" y="302" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/>
<!-- row3 -->
<rect x="612" y="330" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="644" y="330" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="676" y="330" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="708" y="330" width="32" height="28" fill="#f0f2f5" stroke="#aeb8c5"/>
<!-- row4 -->
<rect x="612" y="358" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="644" y="358" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="676" y="358" width="32" height="28" fill="#dcefe3" stroke="#39865a"/><rect x="708" y="358" width="32" height="28" fill="#dcefe3" stroke="#39865a"/>
</g>
<g stroke="#8793a2" stroke-width="2"><path d="M650 280l20 16m0-16l-20 16M682 280l20 16m0-16l-20 16M714 280l20 16m0-16l-20 16M682 308l20 16m0-16l-20 16M714 308l20 16m0-16l-20 16M714 336l20 16m0-16l-20 16"/></g>
<text x="605" y="414" font-size="14" fill="#697789">未来位置先加负无穷掩码；softmax 后对应权重为 0</text>
<text x="772" y="336" font-size="26" fill="#344054">×</text>
<text x="900" y="258" fill="#bd6a18">V (4×3)</text>
<!-- V 4x3 -->
<g fill="#fae6d2" stroke="#bd6a18" stroke-width="1.5">
<rect x="852" y="274" width="30" height="28"/><rect x="882" y="274" width="30" height="28"/><rect x="912" y="274" width="30" height="28"/>
<rect x="852" y="302" width="30" height="28"/><rect x="882" y="302" width="30" height="28"/><rect x="912" y="302" width="30" height="28"/>
<rect x="852" y="330" width="30" height="28"/><rect x="882" y="330" width="30" height="28"/><rect x="912" y="330" width="30" height="28"/>
<rect x="852" y="358" width="30" height="28"/><rect x="882" y="358" width="30" height="28"/><rect x="912" y="358" width="30" height="28"/></g>
<path d="M952 330H1001" stroke="#65758b" stroke-width="2.5"/><path d="M1001 330l-10-6v12z" fill="#65758b"/>
<text x="1050" y="258" fill="#39865a">O (4×3)</text>
<g fill="#dcefe3" stroke="#39865a" stroke-width="1.5">
<rect x="1019" y="274" width="30" height="28"/><rect x="1049" y="274" width="30" height="28"/><rect x="1079" y="274" width="30" height="28"/>
<rect x="1019" y="302" width="30" height="28"/><rect x="1049" y="302" width="30" height="28"/><rect x="1079" y="302" width="30" height="28"/>
<rect x="1019" y="330" width="30" height="28"/><rect x="1049" y="330" width="30" height="28"/><rect x="1079" y="330" width="30" height="28"/>
<rect x="1019" y="358" width="30" height="28"/><rect x="1049" y="358" width="30" height="28"/><rect x="1079" y="358" width="30" height="28"/></g>
</g>
<g font-family="Hiragino Sans GB, Arial, sans-serif" fill="#526174" font-size="16">
<text x="92" y="478">运算顺序：Q 与 K 转置点积后按 √dh 缩放，加因果遮罩，按行 softmax 后乘 V。</text>
<text x="92" y="516">跨步 KV 缓存：保留 K、V；不需要保留历史 Q，也不需要保留 attention 分数或权重。</text>
<text x="92" y="550">此图颜色仅表示张量类型：Q 紫、K 蓝、V 橙、O 绿；灰色叉号表示因果遮罩屏蔽的位置。</text>
</g>
<!-- decode panel -->
<rect x="64" y="618" width="1232" height="330" rx="18" fill="#fff" stroke="#d8e0eb" stroke-width="2"/>
<g font-family="Hiragino Sans GB, Arial, sans-serif" fill="#202b3c">
<text x="92" y="662" font-size="25" font-weight="700">Decode · 处理新位置 E，读取截至 E 的缓存</text>
<text x="92" y="693" font-size="17" fill="#526174">5 个可见位置（含 E）；单个 query 只需与已有及当前 K/V 交互</text>
</g>
<g font-family="Hiragino Sans GB, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
<text x="121" y="748" text-anchor="start" fill="#7541a6">q</text><text x="132" y="758" font-size="12" text-anchor="start" fill="#7541a6">E</text><text x="132" y="736" font-size="12" text-anchor="start" fill="#7541a6">T</text><text x="150" y="748" text-anchor="start" fill="#7541a6">(1×3)</text>
<g fill="#eadcf7" stroke="#7541a6" stroke-width="1.5"><rect x="124" y="763" width="30" height="30"/><rect x="154" y="763" width="30" height="30"/><rect x="184" y="763" width="30" height="30"/></g>
<text x="235" y="786" font-size="26" fill="#344054">×</text>
<text x="280" y="748" text-anchor="start" fill="#27649b">K</text><text x="293" y="758" font-size="12" text-anchor="start" fill="#27649b">≤E</text><text x="296" y="736" font-size="12" text-anchor="start" fill="#27649b">T</text><text x="313" y="748" text-anchor="start" fill="#27649b">(3×5)</text>
<!-- 3x5 -->
<g fill="#d8ebfa" stroke="#27649b" stroke-width="1.5"><rect x="272" y="763" width="28" height="30"/><rect x="300" y="763" width="28" height="30"/><rect x="328" y="763" width="28" height="30"/><rect x="356" y="763" width="28" height="30"/><rect x="384" y="763" width="28" height="30"/><rect x="272" y="793" width="28" height="30"/><rect x="300" y="793" width="28" height="30"/><rect x="328" y="793" width="28" height="30"/><rect x="356" y="793" width="28" height="30"/><rect x="384" y="793" width="28" height="30"/><rect x="272" y="823" width="28" height="30"/><rect x="300" y="823" width="28" height="30"/><rect x="328" y="823" width="28" height="30"/><rect x="356" y="823" width="28" height="30"/><rect x="384" y="823" width="28" height="30"/></g>
<path d="M425 808H480" stroke="#65758b" stroke-width="2.5"/><path d="M480 808l-10-6v12z" fill="#65758b"/>
<text x="500" y="748" text-anchor="start" fill="#344054">qK logits (1×5)</text>
<g fill="#edf1f6" stroke="#77869a" stroke-width="1.3"><rect x="490" y="780" width="28" height="28"/><rect x="518" y="780" width="28" height="28"/><rect x="546" y="780" width="28" height="28"/><rect x="574" y="780" width="28" height="28"/><rect x="602" y="780" width="28" height="28"/></g>
<path d="M640 808H690" stroke="#65758b" stroke-width="2.5"/><path d="M690 808l-10-6v12z" fill="#65758b"/>
<text x="733" y="748" text-anchor="start" fill="#39865a">weights (1×5)</text><text x="620" y="884" text-anchor="start" font-size="15" fill="#39865a">先除以 √dh，再做 softmax</text>
<g fill="#dcefe3" stroke="#39865a" stroke-width="1.4"><rect x="710" y="780" width="28" height="28"/><rect x="738" y="780" width="28" height="28"/><rect x="766" y="780" width="28" height="28"/><rect x="794" y="780" width="28" height="28"/><rect x="822" y="780" width="28" height="28"/></g>
<text x="879" y="808" font-size="25" fill="#344054">×</text>
<text x="946" y="748" text-anchor="start" fill="#bd6a18">V</text><text x="963" y="756" font-size="12" text-anchor="start" fill="#bd6a18">≤E</text><text x="981" y="748" text-anchor="start" fill="#bd6a18">(5×3)</text>
<!-- 5x3 -->
<g fill="#fae6d2" stroke="#bd6a18" stroke-width="1.4"><rect x="943" y="763" width="30" height="25"/><rect x="973" y="763" width="30" height="25"/><rect x="1003" y="763" width="30" height="25"/><rect x="943" y="788" width="30" height="25"/><rect x="973" y="788" width="30" height="25"/><rect x="1003" y="788" width="30" height="25"/><rect x="943" y="813" width="30" height="25"/><rect x="973" y="813" width="30" height="25"/><rect x="1003" y="813" width="30" height="25"/><rect x="943" y="838" width="30" height="25"/><rect x="973" y="838" width="30" height="25"/><rect x="1003" y="838" width="30" height="25"/><rect x="943" y="863" width="30" height="25"/><rect x="973" y="863" width="30" height="25"/><rect x="1003" y="863" width="30" height="25"/></g>
<path d="M1045 808H1111" stroke="#65758b" stroke-width="2.5"/><path d="M1111 808l-10-6v12z" fill="#65758b"/>
<text x="1160" y="748" text-anchor="start" fill="#39865a">o</text><text x="1173" y="758" font-size="12" text-anchor="start" fill="#39865a">E</text><text x="1185" y="748" text-anchor="start" fill="#39865a">(1×3)</text>
<g fill="#dcefe3" stroke="#39865a" stroke-width="1.5"><rect x="1150" y="780" width="30" height="30"/><rect x="1180" y="780" width="30" height="30"/><rect x="1210" y="780" width="30" height="30"/></g>
</g>
<g font-family="Hiragino Sans GB, Arial, sans-serif" fill="#526174" font-size="16">
<text x="92" y="910">本次新增当前位置的 K/V 并追加到缓存；当前 query 用于本轮计算，不写入 KV 缓存。</text>
</g>
<!-- cache note -->
<rect x="64" y="968" width="1232" height="98" rx="12" fill="#eef4fb" stroke="#cbd9e8"/>
<g font-family="Hiragino Sans GB, Arial, sans-serif" fill="#28384c">
<text x="88" y="1004" font-size="18" font-weight="700">单层单头缓存容量：</text><text x="290" y="1004" font-size="19" text-anchor="start">2 × n × d</text><text x="409" y="1010" font-size="13" text-anchor="start">h</text><text x="421" y="1004" font-size="19" text-anchor="start">× b</text><text x="486" y="1004" font-size="17">（K / V 每个位置各存一条向量；b 是每元素字节数。）</text>
<text x="88" y="1042" font-size="17">仅为单层、单头，且 K / V 维度相同的容量；不是整模型总量。</text>
</g>
</svg>
