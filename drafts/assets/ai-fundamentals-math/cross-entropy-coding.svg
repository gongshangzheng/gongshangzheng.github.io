<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" font-family="Arial Unicode MS"><title>交叉熵：编码不匹配时，平均多花多少比特？</title><desc>交叉熵：编码不匹配时，平均多花多少比特？. Original teaching diagram; probabilities and code lengths are explicitly shown.</desc><rect width="960" height="605" fill="#ffffff"/><text x="35" y="43" font-size="26" fill="#243247" text-anchor="start">交叉熵：编码不匹配时，平均多花多少比特？</text><text x="35" y="87" font-size="20" fill="#243247" text-anchor="start">真实频率 p = (1/2, 1/4, 1/8, 1/8)，编码理想长度为 −log₂ q。</text><text x="35" y="135" font-size="20" fill="#243247" text-anchor="start">符号</text><text x="145" y="135" font-size="20" fill="#243247" text-anchor="start">真实概率 p</text><text x="365" y="135" font-size="20" fill="#243247" text-anchor="start">匹配编码 q = p</text><text x="665" y="135" font-size="20" fill="#243247" text-anchor="start">失配编码 q ≠ p</text><rect x="25" y="155" width="900" height="36" rx="8" fill="#f2f5f8"/><text x="35" y="180" font-size="20" fill="#243247" text-anchor="start">A</text><text x="145" y="180" font-size="20" fill="#243247" text-anchor="start">1/2</text><text x="365" y="180" font-size="20" fill="#243247" text-anchor="start">0（1 bit）</text><text x="665" y="180" font-size="20" fill="#243247" text-anchor="start">110（3 bit）</text><rect x="25" y="198" width="900" height="36" rx="8" fill="#ffffff"/><text x="35" y="223" font-size="20" fill="#243247" text-anchor="start">B</text><text x="145" y="223" font-size="20" fill="#243247" text-anchor="start">1/4</text><text x="365" y="223" font-size="20" fill="#243247" text-anchor="start">10（2 bit）</text><text x="665" y="223" font-size="20" fill="#243247" text-anchor="start">10（2 bit）</text><rect x="25" y="241" width="900" height="36" rx="8" fill="#f2f5f8"/><text x="35" y="266" font-size="20" fill="#243247" text-anchor="start">C</text><text x="145" y="266" font-size="20" fill="#243247" text-anchor="start">1/8</text><text x="365" y="266" font-size="20" fill="#243247" text-anchor="start">110（3 bit）</text><text x="665" y="266" font-size="20" fill="#243247" text-anchor="start">0（1 bit）</text><rect x="25" y="284" width="900" height="36" rx="8" fill="#ffffff"/><text x="35" y="309" font-size="20" fill="#243247" text-anchor="start">D</text><text x="145" y="309" font-size="20" fill="#243247" text-anchor="start">1/8</text><text x="365" y="309" font-size="20" fill="#243247" text-anchor="start">111（3 bit）</text><text x="665" y="309" font-size="20" fill="#243247" text-anchor="start">111（3 bit）</text><text x="35" y="374" font-size="22" fill="#243247" text-anchor="start">按真实频率 p 计算平均码长</text><text x="35" y="416" font-size="20" fill="#167568" text-anchor="start">匹配：0.5×1 + 0.25×2 + 0.125×3 + 0.125×3 = 1.75</text><text x="35" y="456" font-size="20" fill="#a45125" text-anchor="start">失配：0.5×3 + 0.25×2 + 0.125×1 + 0.125×3 = 2.50</text><rect x="35" y="484" width="890" height="58" rx="8" fill="#e5f2ec"/><text x="52" y="521" font-size="22" fill="#243247" text-anchor="start">H(p) = 1.75 bit；H(p,q) = 2.50 bit；KL(p || q) = 0.75 bit</text><text x="35" y="577" font-size="18" fill="#243247" text-anchor="start">失配编码隐含 q = (1/8, 1/4, 1/2, 1/8)。两组码都可正确解码。</text></svg>