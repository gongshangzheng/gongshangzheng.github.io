<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Arial Unicode MS"><title>前缀编码树：沿边读比特，到叶节点解码</title><desc>前缀编码树：沿边读比特，到叶节点解码. Original teaching diagram; probabilities and code lengths are explicitly shown.</desc><rect width="960" height="560" fill="#ffffff"/><text x="35" y="43" font-size="26" fill="#243247" text-anchor="start">前缀编码树：沿边读比特，到叶节点解码</text><path d="M480,120 L220,195" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="359.0" y="160.0" font-size="20" fill="#167568" text-anchor="start">0</text><path d="M480,120 L650,195" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="574.0" y="160.0" font-size="20" fill="#167568" text-anchor="start">1</text><path d="M650,230 L510,305" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="589.0" y="270.0" font-size="20" fill="#167568" text-anchor="start">0</text><path d="M650,230 L790,305" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="729.0" y="270.0" font-size="20" fill="#167568" text-anchor="start">1</text><path d="M790,340 L710,415" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="759.0" y="380.0" font-size="20" fill="#167568" text-anchor="start">0</text><path d="M790,340 L875,415" fill="none" stroke="#95a4b7" stroke-width="3"/><text x="841.5" y="380.0" font-size="20" fill="#167568" text-anchor="start">1</text><circle cx="480" cy="105" r="14" fill="#3c5977"/><rect x="148" y="193" width="144" height="44" rx="8" fill="#e5f2ec"/><text x="220" y="222" font-size="20" fill="#243247" text-anchor="middle">A · 0</text><circle cx="650" cy="215" r="14" fill="#3c5977"/><rect x="438" y="303" width="144" height="44" rx="8" fill="#e5f2ec"/><text x="510" y="332" font-size="20" fill="#243247" text-anchor="middle">B · 10</text><circle cx="790" cy="325" r="14" fill="#3c5977"/><rect x="638" y="413" width="144" height="44" rx="8" fill="#e5f2ec"/><text x="710" y="442" font-size="20" fill="#243247" text-anchor="middle">C · 110</text><rect x="803" y="413" width="144" height="44" rx="8" fill="#e5f2ec"/><text x="875" y="442" font-size="20" fill="#243247" text-anchor="middle">D · 111</text><text x="35" y="492" font-size="21" fill="#243247" text-anchor="start">走到叶节点就读出一个符号，再回到根节点读取下一段。</text><text x="35" y="530" font-size="20" fill="#243247" text-anchor="start">没有一个完整码字是另一个码字的开头，因此无需额外分隔符。</text></svg>