<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Arial Unicode MS"><title>常见符号用短码：同一消息可用更少的比特</title><desc>常见符号用短码：同一消息可用更少的比特. Original teaching diagram; probabilities and code lengths are explicitly shown.</desc><rect width="960" height="420" fill="#ffffff"/><text x="35" y="43" font-size="26" fill="#243247" text-anchor="start">常见符号用短码：同一消息可用更少的比特</text><text x="35" y="84" font-size="21" fill="#243247" text-anchor="start">同一串消息：A A A A B B C D（8 个符号）</text><rect x="35" y="105" width="425" height="255" rx="8" fill="#edf2f7"/><text x="55" y="140" font-size="23" fill="#243247" text-anchor="start">定长编码</text><text x="55" y="180" font-size="20" fill="#243247" text-anchor="start">A    p = 1/2    编码：00</text><text x="55" y="212" font-size="20" fill="#243247" text-anchor="start">B    p = 1/4    编码：01</text><text x="55" y="244" font-size="20" fill="#243247" text-anchor="start">C    p = 1/8    编码：10</text><text x="55" y="276" font-size="20" fill="#243247" text-anchor="start">D    p = 1/8    编码：11</text><text x="55" y="328" font-size="21" fill="#167568" text-anchor="start">16 bits / 8 = 2 bits/符号</text><text x="35" y="393" font-size="17" fill="#243247" text-anchor="start">00 00 00 00 01 01 10 11</text><rect x="500" y="105" width="425" height="255" rx="8" fill="#edf2f7"/><text x="520" y="140" font-size="23" fill="#243247" text-anchor="start">按频率设计的前缀编码</text><text x="520" y="180" font-size="20" fill="#243247" text-anchor="start">A    p = 1/2    编码：0</text><text x="520" y="212" font-size="20" fill="#243247" text-anchor="start">B    p = 1/4    编码：10</text><text x="520" y="244" font-size="20" fill="#243247" text-anchor="start">C    p = 1/8    编码：110</text><text x="520" y="276" font-size="20" fill="#243247" text-anchor="start">D    p = 1/8    编码：111</text><text x="520" y="328" font-size="21" fill="#167568" text-anchor="start">14 bits / 8 = 1.75 bits/符号</text><text x="500" y="393" font-size="17" fill="#243247" text-anchor="start">0 0 0 0 10 10 110 111</text></svg>