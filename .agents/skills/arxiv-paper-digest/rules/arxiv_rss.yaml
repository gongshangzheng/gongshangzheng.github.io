# ArXiv RSS 爬取规则配置
# 用于爬取 diffusion / autoregressive / image compression / visual tokenizer 相关论文

name: "arxiv"
url: "https://rss.arxiv.org/rss/cs.AI"
sources:
  - name: "arxiv-ai"
    url: "https://rss.arxiv.org/rss/cs.AI"
  - name: "arxiv-cv"
    url: "https://rss.arxiv.org/rss/cs.CV"
crawl_type: "rss"
update_frequency: 1440
storage_path: "daily-papers"
enabled: true

custom_config:
  max_items: 100
  crawl_time: "00:00"
  include_abstract: true
  auto_digest: true

  translator:
    enabled: true
    source_lang: "en"
    target_lang: "zh"

  filters:
    - type: "time"
      target_days_before: 1
      target_days_after: 0
      description: "时间过滤：爬取目标日期前一天的论文（00:00 ~ 24:00 固定窗口）"
    - type: "and"
      description: "关键词过滤：保留 diffusion、autoregressive、image compression、1D visual tokenizer 或 diffusion visual encoder 相关论文，排除 weather 相关"
      filters:
        - type: "or"
          filters:
            - type: "title"
              keywords: &keywords
                - "diffusion"
                - "autoregressive"
                - "AR model"
                - "autoregression"
                - "image compression"
                - "image rescaling"
                - "learned image compression"
                - "neural image compression"
                - "distributed image compression"
                - "image codec"
                - "1D visual tokenizer"
                - "1-D visual tokenizer"
                - "visual tokenizer"
                - "sequential visual encoding"
                - "1D patch tokenization"
                - "diffusion tokenizer"
                - "diffusion image encoder"
                - "diffusion visual encoder"
                - "continuous visual tokenizer"
            - type: "summary"
              keywords: *keywords
            - type: "and"
              filters:
                - type: "title"
                  keywords: ["image"]
                - type: "or"
                  filters:
                    - type: "title"
                      keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
                    - type: "summary"
                      keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
            - type: "and"
              filters:
                - type: "summary"
                  keywords: ["image"]
                - type: "or"
                  filters:
                    - type: "title"
                      keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
                    - type: "summary"
                      keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
        - type: "not"
          filter:
            type: "or"
            filters:
              - type: "title"
                keywords: ["weather", "forecasting", "meteorology", "precipitation", "rainfall"]
              - type: "summary"
                keywords: ["weather", "forecasting", "meteorology", "precipitation", "rainfall"]
              - type: "title"
                keywords: ["medical", "clinical", "clinic", "diagnosis", "diagnostic", "pathology", "pathological", "radiology", "patient", "patients", "hospital", "disease", "therapy", "therapeutic", "biomedical", "healthcare", "health care", "health", "medical report", "mimic-cxr", "chexpert", "cxr", "colonoscopy", "colposcopy"]
              - type: "summary"
                keywords: ["medical", "clinical", "clinic", "diagnosis", "diagnostic", "pathology", "pathological", "radiology", "patient", "patients", "hospital", "disease", "therapy", "therapeutic", "biomedical", "healthcare", "health care", "health", "medical report", "mimic-cxr", "chexpert", "cxr", "colonoscopy", "colposcopy"]

  category_mapping:
    diffusion:
      folder: "diffusion"
      filter:
        type: "or"
        filters:
          - type: "title"
            keywords: ["diffusion"]
          - type: "summary"
            keywords: ["diffusion"]
    autoregressive:
      folder: "autoregressive"
      filter:
        type: "or"
        filters:
          - type: "title"
            keywords: ["autoregressive", "AR model", "autoregression"]
          - type: "summary"
            keywords: ["autoregressive", "AR model", "autoregression"]
    image_compression:
      folder: "image_compression"
      filter:
        type: "or"
        filters:
          - type: "title"
            keywords: ["image compression", "image rescaling", "learned image compression", "neural image compression", "distributed image compression", "image codec"]
          - type: "summary"
            keywords: ["image compression", "image rescaling", "learned image compression", "neural image compression", "distributed image compression", "image codec"]
          - type: "and"
            filters:
              - type: "title"
                keywords: ["image"]
              - type: "or"
                filters:
                  - type: "title"
                    keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
                  - type: "summary"
                    keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
          - type: "and"
            filters:
              - type: "summary"
                keywords: ["image"]
              - type: "or"
                filters:
                  - type: "title"
                    keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
                  - type: "summary"
                    keywords: ["compression", "codec", "bitrate", "bpp", "rate-distortion", "entropy model"]
    visual_tokenizer_1d:
      folder: "visual_tokenizer_1d"
      filter:
        type: "or"
        filters:
          - type: "title"
            keywords: ["1D visual tokenizer", "1-D visual tokenizer", "sequential visual encoding", "1D patch tokenization"]
          - type: "summary"
            keywords: ["1D visual tokenizer", "1-D visual tokenizer", "sequential visual encoding", "1D patch tokenization"]
    diffusion_visual_encoder:
      folder: "diffusion_visual_encoder"
      filter:
        type: "or"
        filters:
          - type: "title"
            keywords: ["diffusion tokenizer", "diffusion image encoder", "diffusion visual encoder", "continuous visual tokenizer"]
          - type: "summary"
            keywords: ["diffusion tokenizer", "diffusion image encoder", "diffusion visual encoder", "continuous visual tokenizer"]

  org_format: "detailed"
  exporter:
    class: "ArXivOrgExporter"
    title_template: "## [{first_author} --- {title}]({link})"
    path:
      type: "relative"
      base_path: "~/gongshangzheng.github.io/data/daily-papers"
      template: "{base_path}/{date}.json"
    index:
      enabled: false
      path: null
